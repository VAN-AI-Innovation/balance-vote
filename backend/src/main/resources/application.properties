spring.application.name=backend

# DB 접속 정보는 환경변수로 덮어쓸 수 있게 한다.
# 운영 배포 시 SPRING_DATASOURCE_URL / USERNAME / PASSWORD 를 주입한다.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/balance_vote}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# 관객 수백 명의 동시 투표를 처리하려면 기본 커넥션 풀(10)로는 부족하다.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:30}
spring.datasource.hikari.connection-timeout=10000

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# 운영에서 SQL 로그는 성능을 크게 떨어뜨리므로 기본값을 끈다.
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_SHOW_SQL:false}

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

server.port=${PORT:8080}

# 프록시(예: Render, Railway) 뒤에서 https / 원본 호스트를 인식하게 한다.
server.forward-headers-strategy=framework

logging.level.org.springframework.messaging=${MESSAGING_LOG_LEVEL:INFO}
logging.level.org.springframework.web.socket=${WEBSOCKET_LOG_LEVEL:INFO}
logging.level.org.hibernate.SQL=${SQL_LOG_LEVEL:INFO}
logging.level.org.hibernate.tool.schema=INFO

# 컨퍼런스 세션에서 진행할 연도 목록.
# 값을 추가하면 재시작 시 없는 연도만 새로 생성된다.
vote.session.years=${VOTE_SESSION_YEARS:2030,2035,2040,2045,2050}

# 관리자 API 보호용 공유 토큰.
# 비어 있으면 인증이 비활성화되므로 로컬 개발은 그대로 동작하고,
# 운영에서는 ADMIN_TOKEN 을 반드시 지정해야 한다.
admin.token=${ADMIN_TOKEN:}

# 허용할 프론트엔드 오리진(쉼표 구분, 와일드카드 패턴 사용 가능).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173}
app.websocket.allowed-origins=${WS_ALLOWED_ORIGINS:*}
